    <script>
        const slides = [
            // 1 - Portada
            {
                type: 'title',
                content: {
                    title: 'Muerte Celular',
                    subtitle: 'PATOLOGÍA BÁSICA - TECNOLOGÍA MÉDICA 2026',
                    info: 'Práctico IV · Semana del 14 de Septiembre, 2026',
                    instructor: 'TM. Fernanda López M., PhD',
                    email: 'fernanda.lopez@uach.cl'
                }
            },
            // 2 - Objetivos
            {
                type: 'objectives',
                content: {
                    title: 'Objetivos del Práctico',
                    subtitle: 'Al finalizar esta sesión, serás capaz de:',
                    objectives: [
                        'Reconocer en láminas virtuales los patrones morfológicos de necrosis coagulativa y caseosa, comparándolos contra el tejido normal de referencia',
                        'Explicar por qué un mismo tejido puede morir con patrones distintos según la naturaleza del estímulo que lo dañó',
                        'Distinguir necrosis de apoptosis por sus características morfológicas y por sus consecuencias sobre el tejido vecino'
                    ]
                }
            },
            // 3 - Completando el ciclo
            {
                type: 'content',
                content: {
                    title: 'Completando el Ciclo',
                    subtitle: 'Tercera y última parada del espectro de respuestas celulares',
                    items: [
                        '🔄 <strong>Adaptación:</strong> la célula cambia de tamaño, número o fenotipo y sobrevive en un equilibrio nuevo. Es reversible al retirar el estímulo',
                        '⚠️ <strong>Lesión:</strong> el estímulo supera la capacidad de adaptación y aparecen alteraciones estructurales, todavía recuperables',
                        '💀 <strong>Muerte:</strong> se pierde la integridad de las membranas y la función mitocondrial. No hay vuelta atrás',
                        '🧭 <strong>Qué define el desenlace:</strong> el tipo de noxa, su intensidad y cuánto tiempo actúa sobre un tejido con determinada sensibilidad'
                    ]
                }
            },
            // 4 - Necrosis vs Apoptosis
            {
                type: 'comparison',
                content: {
                    title: 'Necrosis vs. Apoptosis',
                    subtitle: 'Dos formas de morir con consecuencias distintas para el tejido vecino',
                    comparison: {
                        headers: ['Característica', 'Necrosis', 'Apoptosis'],
                        rows: [
                            ['Naturaleza', 'Accidental, siempre patológica', 'Programada y regulada; puede ser fisiológica'],
                            ['Tamaño celular', 'Aumentado, la célula se hincha', 'Reducido, la célula se condensa'],
                            ['Membrana plasmática', 'Se rompe y libera el contenido', 'Se mantiene íntegra, con cambios en sus lípidos'],
                            ['Núcleo', 'Picnosis → cariorrexis → cariólisis', 'Condensación y fragmentación ordenada'],
                            ['Inflamación', 'Siempre presente', 'Ausente: los cuerpos apoptóticos son fagocitados'],
                            ['Extensión', 'Grupos de células contiguas', 'Células aisladas dentro de un tejido sano']
                        ]
                    }
                }
            },
            // 5 - Tipos de necrosis
            {
                type: 'content',
                content: {
                    title: 'Tipos de Necrosis',
                    subtitle: 'El patrón morfológico delata qué mató al tejido',
                    items: [
                        '🧊 <strong>Coagulativa:</strong> la arquitectura se conserva días después de la muerte celular. Isquemia en órganos sólidos (riñón, corazón, bazo)',
                        '💧 <strong>Licuefactiva:</strong> las enzimas digieren el tejido y dejan una cavidad. Infarto cerebral e infecciones piógenas',
                        '🧀 <strong>Caseosa:</strong> material blanco friable, sin arquitectura reconocible, rodeado de granuloma. Tuberculosis',
                        '🩸 <strong>Fibrinoide:</strong> depósito eosinófilo brillante en la pared de los vasos. Vasculitis y reacciones inmunes',
                        '🟡 <strong>Grasa:</strong> saponificación de la grasa por lipasas liberadas. Pancreatitis aguda',
                        '🩹 <strong>Gangrenosa:</strong> no es un tipo aparte, sino necrosis isquémica de una extremidad, con o sin sobreinfección'
                    ]
                }
            },
            // 6 - Metodología
            {
                type: 'activity',
                content: {
                    title: 'Metodología de Trabajo',
                    subtitle: 'Análisis autónomo en grupo · 3 casos · 40 minutos',
                    instructions: [
                        '👥 Trabajen en los grupos ya conformados, de 2 a 4 estudiantes',
                        '⏱️ Aproximadamente 12 minutos por lámina: observar, investigar, discutir y concluir',
                        '🔬 Recorran primero a bajo aumento y comparen siempre contra la histología normal del mismo órgano',
                        '🔍 Los enlaces de apoyo de cada caso están al pie de la lámina: úsenlos durante la sesión',
                        '📝 Registren los hallazgos y capturas del grupo: son su material de estudio para la prueba práctica',
                        '❓ El docente circula orientando; al cierre se hace la puesta en común'
                    ]
                }
            },
            // 7 - Caso 1
            {
                type: 'case',
                content: {
                    title: 'Caso 1: Infarto Renal',
                    clinical: {
                        patient: 'Varón de 55 años, hipertenso de larga data y mal control',
                        sample: 'Biopsia renal',
                        symptoms: 'Falla renal aguda dos semanas después de un infarto de miocardio tratado con trombólisis y stent',
                        labs: 'Creatinina 3,5 mg/dL (referencia: 0,6-1,2) · Urea 45 mg/dL (referencia: 7-20)'
                    },
                    questions: [
                        '¿Se reconocen todavía los glomérulos y túbulos, aunque las células estén muertas? ¿Qué les pasó a los núcleos?',
                        '¿Dónde está el límite entre el tejido necrótico y el viable, y qué hay en esa zona?',
                        'Relacione el evento cardíaco previo con la llegada de sangre al riñón: ¿cuál es el mecanismo?',
                        '¿Por qué la isquemia produce este patrón y no una necrosis licuefactiva?'
                    ],
                    concept: 'NECROSIS COAGULATIVA',
                    linkNotes: {
                        histologia: 'Riñón normal: glomérulos, túbulos y sus núcleos, para dimensionar qué se perdió',
                        medline: 'Qué miden la urea y la creatinina y qué indican sobre la función renal',
                        msd: 'Lesión renal aguda: causas isquémicas, evolución del infarto y consecuencias'
                    },
                    links: {
                        caso: 'https://www.virtualpathology.leeds.ac.uk/slides/library/view.php?path=%2FResearch_4%2FTeaching%2FEducation%2FUndergraduate%2F1111.svs',
                        histologia: 'https://histologyguide.com/slideview/MH-141b-kidney/16-slide-1.html?x=23905&y=16102&z=9.30',
                        medline: 'https://medlineplus.gov/lab-tests/bun-blood-urea-nitrogen/',
                        msd: 'https://www.msdmanuals.com/professional/genitourinary-disorders/acute-kidney-injury/acute-kidney-injury-aki'
                    }
                }
            },
            // 8 - Caso 2
            {
                type: 'case',
                content: {
                    title: 'Caso 2: Hepatotoxicidad por Paracetamol',
                    clinical: {
                        patient: 'Mujer de 35 años',
                        sample: 'Biopsia hepática',
                        symptoms: 'Ictericia y dolor en hipocondrio derecho tras una ingesta masiva de paracetamol',
                        labs: 'AST 1.200 U/L (referencia: 10-40) · ALT 1.500 U/L (referencia: 7-56) · Bilirrubina total 8 mg/dL (referencia: 0,1-1,2)'
                    },
                    questions: [
                        '¿La necrosis compromete todo el lobulillo o predomina en alguna zona? ¿Cuál?',
                        '¿Qué diferencia hay entre esta necrosis y la del caso anterior, si ambas son coagulativas?',
                        'Relacione la magnitud de las transaminasas con la cantidad de hepatocitos que perdieron su membrana',
                        '¿Por qué un tóxico metabolizado en el hígado daña primero esa zona del lobulillo?'
                    ],
                    concept: 'NECROSIS COAGULATIVA',
                    linkNotes: {
                        histologia: 'Hígado normal: lobulillo, vena centrolobulillar y espacio porta como mapa de referencia',
                        medline: 'Qué mide la bilirrubina y por qué se eleva cuando falla el hepatocito',
                        msd: 'Intoxicación por paracetamol: metabolito tóxico, zona afectada y tratamiento'
                    },
                    links: {
                        caso: 'https://www.virtualpathology.leeds.ac.uk/slides/library/view.php?path=%2FResearch_4%2FTeaching%2FEducation%2FUndergraduate%2F1061.svs',
                        histologia: 'https://histologyguide.com/slideview/MH-126b-liver/15-slide-1.html?x=30667&y=15752&z=15.90',
                        medline: 'https://medlineplus.gov/lab-tests/bilirubin-blood-test/',
                        msd: 'https://www.msdmanuals.com/professional/injuries-poisoning/poisoning/acetaminophen-poisoning?query=paracetamol'
                    }
                }
            },
            // 9 - Caso 3
            {
                type: 'case',
                content: {
                    title: 'Caso 3: Tuberculosis Pulmonar',
                    clinical: {
                        patient: 'Varón de 60 años, fumador',
                        sample: 'Biopsia pulmonar',
                        symptoms: 'Tos persistente, fiebre, sudoración nocturna y baja de peso de varias semanas',
                        labs: 'Radiografía de tórax con múltiples lesiones pequeñas de distribución uniforme · PPD positivo · cultivo de esputo en proceso'
                    },
                    questions: [
                        '¿Qué aspecto tiene el centro de la lesión y por qué no se reconoce la arquitectura del pulmón?',
                        '¿Qué células rodean ese centro y cómo se llama esa estructura organizada?',
                        'Relacione el cuadro clínico con la respuesta inmune que genera este patrón de necrosis',
                        '¿Por qué la respuesta del huésped, y no solo el microorganismo, explica lo que observa?'
                    ],
                    concept: 'NECROSIS CASEOSA',
                    linkNotes: {
                        histologia: 'Pulmón normal: alvéolos, tabiques y bronquiolos, para medir cuánto tejido se destruyó',
                        medline: 'En qué consiste el tamizaje de tuberculosis y qué significa un PPD positivo',
                        msd: 'Tuberculosis: cómo el granuloma contiene al bacilo y por qué su centro se necrosa'
                    },
                    links: {
                        caso: 'https://www.virtualpathology.leeds.ac.uk/slides/library/view.php?path=%2FResearch_4%2FTeaching%2FEducation%2FUndergraduate%2F1104.svs',
                        histologia: 'https://histologyguide.com/slideview/MH-138-lung/17-slide-1.html?x=24212&y=14372&z=4.5',
                        medline: 'https://medlineplus.gov/lab-tests/tuberculosis-screening/',
                        msd: 'https://www.msdmanuals.com/professional/infectious-diseases/mycobacteria/tuberculosis-tb?query=tuberculosis'

            // 10 - Síntesis integradora
            {

                                'Zona infartada delimitada por inflamación; termina reemplazada por una cicatriz'
                            ]
                        },
                        {
                            name: 'Toxicidad hepática',
                            icon: 'flask-conical',
                            color: 'amber',
                            cells: [
                                'Metabolito tóxico del paracetamol generado en el propio hepatocito',
                                'Depleción de glutatión y daño oxidativo directo sobre las membranas',
                                'Necrosis de distribución zonal alrededor de la vena centrolobulillar',
                                'Falla hepática aguda; el hígado puede regenerar si sobrevive suficiente parénquima'

                            name: 'Tuberculosis',
                            icon: 'shield-alert',
                            color: 'green',
                            cells: [
                                'Micobacteria que sobrevive dentro del macrófago',

            const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
            const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
            if (deltaX > deltaY && deltaX > 10) {
                e.preventDefault();
            }
        }

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {

            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-smooth ${i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400 hover:bg-purple-300'}`;
                dot.addEventListener('click', () => goToSlide(i));
                pagination.appendChild(dot);
            }
            paginationMobile.innerHTML = '';
            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-smooth ${i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400'}`;
                dot.addEventListener('click', () => goToSlide(i));
                paginationMobile.appendChild(dot);
            }
        }
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtnMobile = document.getElementById('prevBtnMobile');
            const nextBtnMobile = document.getElementById('nextBtnMobile');
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
            prevBtnMobile.disabled = currentSlide === 0;
            nextBtnMobile.disabled = currentSlide === slides.length - 1;
            createPagination();
        }
        function previousSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
                updateNavigation();
            }
        }
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
                updateNavigation();
            }
        }
        function goToSlide(index) {
            if (index >= 0 && index < slides.length) {
                currentSlide = index;
                renderSlide();
                updateNavigation();
            }
        }
        document.getElementById('prevBtn').addEventListener('click', previousSlide);
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtnMobile').addEventListener('click', previousSlide);
        document.getElementById('nextBtnMobile').addEventListener('click', nextSlide);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                previousSlide();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
            } else if (e.key === 'Home') {
                goToSlide(0);
            } else if (e.key === 'End') {
                goToSlide(slides.length - 1);
            }
        });
    
        // Pantalla completa: boton del header y tecla F
        (function () {
            const fsBtn = document.getElementById('fullscreenBtn');
            if (!fsBtn) return;
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }
            fsBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                const icon = document.fullscreenElement ? 'minimize' : 'maximize';
                fsBtn.innerHTML = '<i data-lucide="' + icon + '" class="w-5 h-5 text-yellow-400"></i>';
                fsBtn.title = document.fullscreenElement ? 'Salir de pantalla completa (F)' : 'Pantalla completa (F)';
                if (window.lucide) lucide.createIcons();
            });
            document.addEventListener('keydown', (e) => {
                if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const t = e.target.tagName;
                    if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
                    e.preventDefault();
                    toggleFullscreen();
                }
            });
        })();
</script>
</body>
</html>
