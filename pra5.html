        const slides = [

            {

                    title: 'Objetivos del Práctico',
                    subtitle: 'Al finalizar esta sesión, serás capaz de:',
                    objectives: [
                        'Reconocer en láminas virtuales las células propias del infiltrado inflamatorio agudo y crónico, comparándolas contra el tejido normal de referencia',
                        'Distinguir una respuesta inflamatoria aguda de una crónica a partir del tipo celular, la arquitectura del tejido y la presencia de fibrosis',
                        'Explicar cómo la inflamación que no se resuelve termina reemplazando tejido funcional por tejido cicatricial'
                    ]
                }
            },
            // 3 - Conceptos fundamentales
            {
                type: 'content',
                content: {
                    title: 'Conceptos Fundamentales',
                    subtitle: 'La inflamación es la respuesta del tejido vascularizado frente a un agente que lo daña',
                    items: [
                        '🔥 <strong>Inflamación aguda:</strong> respuesta rápida, de minutos a días. Predominan el edema y los neutrófilos que llegan desde el vaso hacia el foco',
                        '🕰️ <strong>Inflamación crónica:</strong> respuesta que persiste semanas o años. Predominan linfocitos, células plasmáticas y macrófagos, junto a fibrosis',
                        '💧 <strong>Exudado:</strong> líquido rico en proteínas y células que sale del vaso al aumentar su permeabilidad. Cuando abundan los neutrófilos muertos, se llama pus',
                        '🧱 <strong>Reparación:</strong> el tejido se regenera o se reemplaza por cicatriz. Cuál de las dos ocurre depende del tejido y de si la matriz quedó intacta'
                    ]
                }
            },
            // 4 - Aguda vs crónica
            {
                type: 'comparison',
                content: {
                    title: 'Inflamación Aguda vs. Crónica',
                    subtitle: 'Lo que cambia no es solo el tiempo, sino quién llega y qué deja atrás',
                    comparison: {
                        headers: ['Característica', 'Aguda', 'Crónica'],
                        rows: [
                            ['Duración', 'Minutos a días', 'Semanas, meses o años'],
                            ['Célula predominante', 'Neutrófilo', 'Linfocito, célula plasmática y macrófago'],
                            ['Componente vascular', 'Vasodilatación y aumento de permeabilidad: edema', 'Proliferación de vasos nuevos (angiogénesis)'],
                            ['Hallazgo en el tejido', 'Exudado, pus, congestión', 'Fibrosis, granuloma, destrucción tisular'],
                            ['Inicio', 'Brusco, frente a infección o necrosis', 'Insidioso, o como continuación de una aguda no resuelta'],
                            ['Desenlace', 'Resolución completa si se elimina la causa', 'Cicatriz y pérdida progresiva de tejido funcional']
                        ]
                    }
                }
            },
            // 5 - Metodología
            {
                type: 'activity',
                content: {
                    title: 'Metodología de Trabajo',
                    subtitle: 'Análisis autónomo en grupo · 2 casos · 40 minutos',
                    instructions: [
                        '👥 Trabajen en los grupos ya conformados, de 2 a 4 estudiantes',
                        '⏱️ Aproximadamente 15 minutos por lámina: observar, investigar, discutir y concluir',
                        '🔬 Recorran primero a bajo aumento y comparen siempre contra la histología normal del mismo órgano',
                        '🔍 Los enlaces de apoyo de cada caso están al pie de la lámina: úsenlos durante la sesión',
                        '📝 Registren los hallazgos y capturas del grupo: son su material de estudio para la prueba práctica',
                        '❓ El docente circula orientando; al cierre se hace la puesta en común'
                    ]
                }
            },
            // 6 - Caso 1
            {
                type: 'case',
                content: {
                    title: 'Caso 1: Apendicitis Aguda',
                    clinical: {
                        patient: 'Varón de 20 años, sin antecedentes de importancia',
                        sample: 'Apéndice cecal, pieza quirúrgica',
                        symptoms: 'Dolor periumbilical que migró a fosa ilíaca derecha, con náuseas, vómitos y fiebre de 38,5 °C',
                        labs: 'Neutrófilos 14.000/µL (referencia: 4.000-11.000) · PCR 25 mg/L (referencia: &lt;5) · Ecografía: apéndice no compresible de 8 mm'
                    },
                    questions: [
                        '¿Qué célula predomina en el infiltrado y en qué capas de la pared se encuentra?',
                        '¿Hasta dónde llega el compromiso: mucosa, muscular o toda la pared? ¿Qué implica eso clínicamente?',
                        'Relacione la obstrucción del lumen apendicular con la secuencia de eventos que observa',
                        '¿Qué habría pasado con este tejido si el cuadro no se hubiera operado a tiempo?'
                    ],
                    concept: 'INFLAMACIÓN AGUDA',
                    linkNotes: {
                        histologia: 'Apéndice normal: mucosa, tejido linfoide y capas de la pared sin infiltrado',
                        medline: 'Qué es la apendicitis, cómo se presenta y por qué es una urgencia quirúrgica',
                        msd: 'Apendicitis: obstrucción, isquemia de la pared y riesgo de perforación'
                    },
                    links: {
                        caso: 'https://www.virtualpathology.leeds.ac.uk/slides/library/view.php?path=%2FResearch_4%2FTeaching%2FEducation%2FTeaching%2FMFD_GI%2FAppendix%2F9143.svs',
                        histologia: 'https://histologyguide.com/slideview/MH-122-appendix/14-slide-1.html',
                        medline: 'https://medlineplus.gov/ency/article/003356.htm',
                        msd: 'https://www.msdmanuals.com/professional/gastrointestinal-disorders/acute-abdomen-and-surgical-gastroenterology/appendicitis?query=appendicitis'
                    }
                }
            },
            // 7 - Caso 2
            {
                type: 'case',
                content: {
                    title: 'Caso 2: Cirrosis Hepática',
                    clinical: {
                        patient: 'Mujer de 47 años, con hepatitis B crónica de 20 años de evolución',
                        sample: 'Biopsia hepática',
                        symptoms: 'Fatiga, ictericia progresiva y molestias en hipocondrio derecho hace seis meses. Sin consumo problemático de alcohol',
                        labs: 'Bilirrubina 3,2 mg/dL · AST 85 · ALT 78 U/L · Albúmina 2,8 g/dL · INR 1,6 · Ecografía: hígado irregular y esplenomegalia'
                    },
                    questions: [
                        '¿Qué células componen el infiltrado y dónde se ubican en el lobulillo?',
                        '¿Se reconocen los lobulillos o hay nódulos rodeados de tejido fibroso?',
                        'Relacione la albúmina baja y el INR prolongado con los hepatocitos funcionantes que quedan',
                        '¿Por qué esta inflamación no se resolvió y terminó en fibrosis?'
                    ],
                    concept: 'INFLAMACIÓN CRÓNICA',
                    linkNotes: {
                        histologia: 'Hígado normal: lobulillo, espacio porta y vena centrolobulillar, para ver cuánta arquitectura se perdió',
                        medline: 'Qué miden el tiempo de protrombina y el INR y por qué se alteran en la falla hepática',
                        msd: 'Hepatitis B crónica: daño sostenido, fibrosis progresiva y evolución a cirrosis'
                    },
                    links: {
                        caso: 'https://www.virtualpathology.leeds.ac.uk/slides/library/view.php?path=%2FResearch_4%2FTeaching%2FEducation%2FUndergraduate%2F1061.svs',
                        histologia: 'https://histologyguide.com/slideview/MH-126b-liver/15-slide-1.html?x=30667&y=15752&z=15.90',
                        medline: 'https://medlineplus.gov/lab-tests/prothrombin-time-test-and-inr-ptinr/',
                        msd: 'https://www.msdmanuals.com/professional/hepatic-and-biliary-disorders/hepatitis/hepatitis-b-chronic'
                    }
                }
            },
            // 8 - Síntesis integradora
            {
                type: 'table',
                content: {
                    title: 'Síntesis Integradora',
                    subtitle: 'Dos inflamaciones frente al mismo esquema: quién llega, qué hace y qué queda del tejido',
                    headers: ['Caso', 'Estímulo y duración', 'Célula predominante', 'Hallazgo morfológico clave', 'Qué queda del tejido'],
                    rows: [
                        {
                            name: 'Apendicitis aguda',
                            icon: 'flame',
                            color: 'red',
                            cells: [
                                'Obstrucción del lumen con proliferación bacteriana, en horas a días',
                                'Neutrófilo, que migra desde el vaso hacia la pared y el lumen',
                                'Infiltrado neutrofílico que atraviesa las capas, con edema, congestión y exudado',
                                'Si se retira la causa, resolución completa; si no, perforación y peritonitis'
                            ]
                        },
                        {
                            name: 'Cirrosis hepática',
                            icon: 'clock',
                            color: 'purple',
                            cells: [
                                'Infección viral que el sistema inmune no logra eliminar, durante años',
                                'Linfocito, célula plasmática y macrófago, junto al fibroblasto que deposita colágeno',
                                'Nódulos de hepatocitos regenerados rodeados por septos fibrosos; arquitectura lobulillar perdida',
                                'Tejido funcional reemplazado por cicatriz: la pérdida es irreversible'
                            ]
                        }
                    ],
                    note: 'La inflamación aguda intenta resolver; la crónica convive con el daño. Cuando la causa persiste, la reparación deja de regenerar y empieza a cicatrizar, y ahí es donde el órgano pierde función.'
                }
            },
            // 9 - Mensajes clave
            {
                type: 'content',
                content: {
                    title: 'Mensajes Clave',
                    items: [
                        '🧫 <strong>La célula dominante fecha la lesión:</strong> neutrófilos hablan de días; linfocitos, células plasmáticas y fibrosis, de meses o años',
                        '🩸 <strong>La inflamación es un fenómeno vascular:</strong> sin vasos no hay edema, ni llegada de células, ni exudado',
                        '🔁 <strong>La crónica muchas veces es una aguda que no se resolvió:</strong> el agente sigue ahí, y la respuesta cambia de protagonistas',
                        '🧱 <strong>Reparar no siempre es regenerar:</strong> cuando la matriz se destruye, el tejido se sustituye por cicatriz y esa función no vuelve',
                        '🧭 <strong>Sin normal no hay patológico:</strong> reconocer un infiltrado exige saber qué células viven normalmente en ese tejido',
                        '🏥 <strong>Detrás de cada lámina hay un paciente:</strong> los exámenes alterados miden justamente el tejido que ya no está'

                    ]

            // 11 - Preguntas
            {
                type: 'qa',
                content: {
                    title: '¿Preguntas?',

        function createPagination() {

                const dot = document.createElement('button');

                dot.addEventListener('click', () => goToSlide(i));
                pagination.appendChild(dot);
            }
            paginationMobile.innerHTML = '';
            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-smooth ${i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400'}`;

        }
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            const nextBtnMobile = document.getElementById('nextBtnMobile');
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
            prevBtnMobile.disabled = currentSlide === 0;
            nextBtnMobile.disabled = currentSlide === slides.length - 1;
            createPagination();
        }
        function previousSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
                updateNavigation();
            }
        }
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
                updateNavigation();
            }
        }
        function goToSlide(index) {
            if (index >= 0 && index < slides.length) {
                currentSlide = index;
                renderSlide();
                updateNavigation();
            }
        }
        document.getElementById('prevBtn').addEventListener('click', previousSlide);
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtnMobile').addEventListener('click', previousSlide);
        document.getElementById('nextBtnMobile').addEventListener('click', nextSlide);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                previousSlide();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
            } else if (e.key === 'Home') {
                goToSlide(0);
            } else if (e.key === 'End') {
                goToSlide(slides.length - 1);
            }
        });
    
        // Pantalla completa: boton del header y tecla F
        (function () {
            const fsBtn = document.getElementById('fullscreenBtn');
            if (!fsBtn) return;
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }
            fsBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                const icon = document.fullscreenElement ? 'minimize' : 'maximize';
                fsBtn.innerHTML = '<i data-lucide="' + icon + '" class="w-5 h-5 text-yellow-400"></i>';
                fsBtn.title = document.fullscreenElement ? 'Salir de pantalla completa (F)' : 'Pantalla completa (F)';
                if (window.lucide) lucide.createIcons();
            });
            document.addEventListener('keydown', (e) => {
                if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const t = e.target.tagName;
                    if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
                    e.preventDefault();
                    toggleFullscreen();
                }
            });
        })();
