    <script>
        const slides = [
            // 1 - Portada
            {
                type: 'title',
                content: {
                    title: 'Neoplasias Malignas',
                    subtitle: 'PATOLOGÍA BÁSICA - TECNOLOGÍA MÉDICA 2026',
                    info: 'Práctico VII · Semana del 2 de Noviembre, 2026',
                    instructor: 'TM. Fernanda López M., PhD',
                    email: 'fernanda.lopez@uach.cl'

            // 2 - Objetivos

                type: 'objectives',
                content: {
                    title: 'Objetivos del Práctico',
                    subtitle: 'Al finalizar esta sesión, serás capaz de:',
                    objectives: [
                        'Reconocer en láminas virtuales los criterios morfológicos de malignidad: atipia, pleomorfismo, mitosis atípicas, necrosis e invasión',
                        'Comparar una neoplasia maligna con su contraparte benigna del mismo tejido y fundamentar qué la hace maligna',
                        'Relacionar el grado histológico y los hallazgos moleculares con el pronóstico y con las decisiones terapéuticas del paciente'
                    ]
                }
            },
            // 3 - Benigna vs maligna
            {
                type: 'comparison',
                content: {
                    title: 'Neoplasias Benignas vs. Malignas',
                    subtitle: 'La diferencia decisiva no es el aspecto de la célula, sino lo que el tumor hace',
                    comparison: {
                        headers: ['Característica', 'Benigna', 'Maligna'],
                        rows: [
                            ['Diferenciación', 'Conservada: se reconoce el tejido de origen', 'Variable, hasta la anaplasia'],
                            ['Ritmo de crecimiento', 'Lento, con mitosis escasas y normales', 'Más rápido, con mitosis frecuentes y atípicas'],
                            ['Borde', 'Expansivo: empuja y comprime', 'Infiltrativo: atraviesa la membrana basal y destruye'],
                            ['Metástasis', 'Nunca', 'Frecuente, por vía linfática, hematógena o por cavidades'],
                            ['Necrosis y hemorragia', 'Infrecuentes', 'Habituales, porque el tumor crece más que su irrigación'],
                            ['Consecuencia clínica', 'Local: efecto de masa', 'Local y sistémica: caquexia, síndromes paraneoplásicos, muerte']
                        ]
                    }
                }
            },
            // 4 - Criterios de malignidad
            {
                type: 'content',
                content: {
                    title: 'Criterios Histológicos de Malignidad',
                    subtitle: 'Qué buscar en la lámina, del bajo al alto aumento',
                    items: [
                        '🌊 <strong>Invasión:</strong> el criterio decisivo. Ruptura de la membrana basal y penetración destructiva del estroma, del músculo o de los vasos',
                        '🧬 <strong>Pleomorfismo y atipia:</strong> variación marcada de tamaño y forma de células y núcleos, con contornos irregulares',
                        '📊 <strong>Relación núcleo/citoplasma aumentada:</strong> núcleos grandes e hipercromáticos, con nucléolos prominentes',
                        '⚡ <strong>Mitosis atípicas y numerosas:</strong> figuras multipolares o asimétricas; su recuento define el grado histológico',
                        '💀 <strong>Necrosis tumoral:</strong> el tumor crece más rápido que su propia irrigación y su centro muere',
                        '🩸 <strong>Invasión vascular y linfática:</strong> células tumorales dentro de la luz de un vaso, la antesala de la metástasis'
                    ]
                }
            },
            // 5 - Evolución y complicaciones
            {
                type: 'content',
                content: {
                    title: 'Evolución y Complicaciones',
                    subtitle: 'Cómo un tumor maligno enferma al paciente',
                    items: [
                        '🌊 <strong>Invasión local:</strong> destruye el tejido vecino, obstruye estructuras y produce dolor y pérdida de función',
                        '🔀 <strong>Metástasis:</strong> diseminación a distancia por vía linfática, hematógena o por cavidades. Es la principal causa de muerte',
                        '⚡ <strong>Caquexia:</strong> desgaste progresivo con baja de peso, anorexia y debilidad, mediado por citoquinas y no solo por la ingesta',
                        '🔥 <strong>Síndromes paraneoplásicos:</strong> manifestaciones sistémicas por sustancias que produce el tumor, como hipercalcemia o trombosis',
                        '🩸 <strong>Hemorragia y ulceración:</strong> por invasión vascular y necrosis de la superficie tumoral',
                        '🛡️ <strong>Inmunosupresión:</strong> mayor susceptibilidad a infecciones, agravada por el tratamiento'
                    ]
                }
            },
            // 6 - Nomenclatura
            {
                type: 'content',
                content: {
                    title: 'Nomenclatura',
                    subtitle: 'El sufijo indica el origen y, al mismo tiempo, la malignidad',
                    items: [
                        '🧱 <strong>Origen epitelial:</strong> carcinoma. Se precisa con el patrón: adenocarcinoma, carcinoma escamoso, carcinoma papilar',
                        '🏗️ <strong>Origen mesenquimal:</strong> sarcoma. Liposarcoma, condrosarcoma, osteosarcoma, leiomiosarcoma',
                        '🩸 <strong>Origen hematolinfoide:</strong> leucemias y linfomas, que no siguen la regla del sufijo',
                        '⚠️ <strong>Trampas frecuentes:</strong> melanoma, seminoma y mesotelioma son malignos pese a terminar en "-oma"'

                    concept: 'NEOPLASIA MALIGNA EPITELIAL',
                    imagenes: [
                        { tipo: 'Macro', label: 'Lesión ulcerada e infiltrante (Borrmann 2)', url: 'https://pathology.or.jp/corepicturesEN/09/c09/images/01.jpg', fuente: 'Japanese Society of Pathology' },
                        { tipo: 'H-E', label: 'Vista panorámica: glándulas atípicas infiltrantes', url: 'https://www.pathologyoutlines.com/imgau/colontumoradenocarcinomamicro01.jpg', fuente: 'PathologyOutlines' },
                        { tipo: 'H-E', label: 'Mayor aumento: atipia nuclear', url: 'https://www.pathologyoutlines.com/imgau/colontumoradenocarcinomamicro02.jpg', fuente: 'PathologyOutlines' },
                        { tipo: 'H-E', label: 'Patrón cribiforme', url: 'https://www.pathologyoutlines.com/imgau/colontumoradenocarcinomamicro04.jpg', fuente: 'PathologyOutlines' },
                        { tipo: 'H-E', label: 'Necrosis sucia intraluminal', url: 'https://www.pathologyoutlines.com/imgau/colontumoradenocarcinomamicro03.jpg', fuente: 'PathologyOutlines' },
                        { tipo: 'H-E', label: 'Reacción desmoplásica del estroma', url: 'https://www.pathologyoutlines.com/imgau/colontumoradenocarcinomamicro05.jpg', fuente: 'PathologyOutlines' },
                        { tipo: 'H-E', label: 'Invasión linfovascular', url: 'https://www.pathologyoutlines.com/imgau/colontumoradenocarcinomamicro06.jpg', fuente: 'PathologyOutlines' },
                        { tipo: 'Estadificación', label: 'pT3: invasión de la grasa pericólica', url: 'https://www.pathologyoutlines.com/imgau/colonstagingcarcinomaarole09.jpg', fuente: 'PathologyOutlines · Arole' }
                    ],
                    linkLabels: { msd: 'RAS y terapias dirigidas' },
                    linkNotes: {

                        medline: 'Qué detecta el test de sangre oculta en heces y su papel en el tamizaje',
                        msd: 'Qué hace la vía RAS y por qué una mutación KRAS predice resistencia a terapia anti-EGFR'
                    },
                    links: {
                        caso: 'https://www.virtualpathology.leeds.ac.uk/slides/library/view.php?path=%2FResearch_4%2FTeaching%2FEducation%2FUndergraduate%2F1485.svs',

                        histologia: 'https://histologyguide.com/slideview/MH-123-colon/14-slide-1.html?x=32225&y=8989&z=3.30',

            },

            if (deltaX > deltaY && deltaX > 10) {

            const touchEndX = e.changedTouches[0].clientX;

                                <div class="text-center mb-6">
                                    <i data-lucide="message-circle" class="w-16 h-16 mx-auto mb-4 text-yellow-400"></i>
                                    <h1 class="mobile-title font-bold text-gray-800 mb-3">${slide.content.title}</h1>
                                </div>
                                <div class="bg-white text-center p-6 rounded-xl shadow-lg">
                                    <div class="space-y-6">
                                        <h3 class="mobile-subtitle font-bold text-gray-800">${slide.content.contact.instructor}</h3>
                                        <p class="text-purple-600 mobile-text">${slide.content.contact.email}</p>
                                                <a href="https://www.instagram.com/tecmedhub/" target="_blank" class="link-card bg-gradient-to-r from-purple-50 to-yellow-50 p-4 rounded-lg border-2 border-purple-200 block">
                                                    <div class="flex items-center justify-center">
                                                        <i data-lucide="brain" class="w-6 h-6 text-purple-600 mr-2"></i>
                                                        <i data-lucide="cpu" class="w-6 h-6 text-yellow-600 mr-3"></i>
                                                        <span class="text-xl font-bold text-transparent bg-gradient-to-r from-purple-600 to-yellow-600 bg-clip-text">
                                                            Laboratorio TecmedHUB
                                                        </span>
                                                    </div>
                                                </a>
                                        <div class="flex items-center justify-center gap-3">
                                            <i data-lucide="building" class="w-5 h-5 text-gray-600"></i>
                                            <p class="text-gray-600 mobile-text">${slide.content.contact.office}</p>
                                        </div>
                                        <p class="text-gray-600 mobile-text">${slide.content.contact.hours}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="hidden md:block desktop-fit desktop-compact bg-gradient-to-br from-indigo-50 to-purple-50">
                                <div class="desktop-title-with-icon">
                                    <i data-lucide="message-circle" class="desktop-title-icon w-12 h-12 text-yellow-400"></i>
                                    <h1 class="desktop-main-title font-bold text-gray-800">${slide.content.title}</h1>
                                </div>
                                <div class="bg-white text-center p-6 rounded-xl shadow-lg w-full px-4 max-w-2xl mx-auto">
                                    <div class="space-y-6">
                                        <h3 class="font-bold text-gray-800">${slide.content.contact.instructor}</h3>
                                        <p class="text-purple-600">${slide.content.contact.email}</p>
                                                <a href="https://www.instagram.com/tecmedhub/" target="_blank" class="link-card bg-gradient-to-r from-blue-50 to-purple-50 p-4 rounded-lg border-2 border-purple-200 block">
                                                    <div class="flex items-center justify-center">
                                                        <i data-lucide="brain" class="w-6 h-6 text-blue-600 mr-2"></i>
                                                        <i data-lucide="cpu" class="w-6 h-6 text-purple-600 mr-3"></i>
                                                        <span class="text-xl font-bold text-transparent bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text">
                                                            Laboratorio TecmedHUB
                                                        </span>
                                                    </div>
                                                </a>
                                        <div class="flex items-center justify-center gap-3">
                                            <i data-lucide="building" class="w-5 h-5 text-gray-600"></i>
                                            <p class="text-gray-600">${slide.content.contact.office}</p>
                                        </div>
                                        <p class="text-gray-600">${slide.content.contact.hours}</p>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                default:
                    return `<div class="h-full flex items-center justify-center p-6"><p class="mobile-text md:text-2xl lg:text-3xl">Contenido no disponible</p></div>`;
            }
        }
        function createPagination() {
            const pagination = document.getElementById('pagination');
            const paginationMobile = document.getElementById('paginationMobile');
            pagination.innerHTML = '';
            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-smooth ${i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400 hover:bg-purple-300'}`;
                dot.addEventListener('click', () => goToSlide(i));
                pagination.appendChild(dot);
            }
            paginationMobile.innerHTML = '';
            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-smooth ${i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400'}`;
                dot.addEventListener('click', () => goToSlide(i));
                paginationMobile.appendChild(dot);
            }
        }
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtnMobile = document.getElementById('prevBtnMobile');
            const nextBtnMobile = document.getElementById('nextBtnMobile');
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
            prevBtnMobile.disabled = currentSlide === 0;
            nextBtnMobile.disabled = currentSlide === slides.length - 1;
            createPagination();
        }
        function previousSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
                updateNavigation();
            }
        }
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
                updateNavigation();
            }
        }
        function goToSlide(index) {
            if (index >= 0 && index < slides.length) {
                currentSlide = index;
                renderSlide();
                updateNavigation();
            }
        }
        document.getElementById('prevBtn').addEventListener('click', previousSlide);
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtnMobile').addEventListener('click', previousSlide);
        document.getElementById('nextBtnMobile').addEventListener('click', nextSlide);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                previousSlide();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
            } else if (e.key === 'Home') {
                goToSlide(0);
            } else if (e.key === 'End') {
                goToSlide(slides.length - 1);
            }
        });
    
        // Pantalla completa: boton del header y tecla F
        (function () {
            const fsBtn = document.getElementById('fullscreenBtn');
            if (!fsBtn) return;
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }
            fsBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                const icon = document.fullscreenElement ? 'minimize' : 'maximize';
                fsBtn.innerHTML = '<i data-lucide="' + icon + '" class="w-5 h-5 text-yellow-400"></i>';
                fsBtn.title = document.fullscreenElement ? 'Salir de pantalla completa (F)' : 'Pantalla completa (F)';
                if (window.lucide) lucide.createIcons();
            });
            document.addEventListener('keydown', (e) => {
                if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const t = e.target.tagName;
                    if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
                    e.preventDefault();
                    toggleFullscreen();
                }
            });
        })();
        // Modal de imágenes del caso: miniaturas y vista ampliada
        (function () {
            const modal = document.createElement('div');
            modal.id = 'imagenesModal';
            modal.className = 'fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-3 md:p-6';
            modal.innerHTML = '<div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-full flex flex-col overflow-hidden">'
                + '<div class="flex items-center justify-between gap-3 px-4 py-2 bg-purple-900 text-white">'
                + '<button type="button" id="imgBack" class="hidden items-center gap-1 text-sm text-yellow-300"><i data-lucide="arrow-left" class="w-4 h-4"></i> Volver</button>'
                + '<h3 id="imgTitle" class="font-bold text-base md:text-lg truncate flex-1"></h3>'
                + '<button type="button" id="imgClose" class="p-1" title="Cerrar (Esc)"><i data-lucide="x" class="w-5 h-5 text-yellow-300"></i></button>'
                + '</div><div id="imgBody" class="overflow-y-auto p-3 md:p-4"></div></div>';
            document.body.appendChild(modal);
            const body = modal.querySelector('#imgBody');
            const back = modal.querySelector('#imgBack');
            const title = modal.querySelector('#imgTitle');
            const colores = { 'Macro': 'bg-amber-100 text-amber-800', 'Clínica': 'bg-amber-100 text-amber-800', 'H-E': 'bg-pink-100 text-pink-800', 'IHQ': 'bg-orange-100 text-orange-800', 'Citología': 'bg-blue-100 text-blue-800', 'Estadificación': 'bg-teal-100 text-teal-800' };
            let lista = [];

            function chip(t) { return '<span class="text-[11px] font-bold uppercase tracking-wide px-2 py-0.5 rounded ' + (colores[t] || 'bg-purple-100 text-purple-800') + '">' + t + '</span>'; }

            function grid() {
                back.classList.add('hidden'); back.classList.remove('flex');
                body.innerHTML = '<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">' + lista.map((im, i) =>
                    '<button type="button" data-i="' + i + '" class="text-left bg-gray-50 border rounded-lg overflow-hidden hover:shadow-lg hover:border-purple-400 transition">'
                    + '<img src="' + im.url + '" alt="' + im.label + '" loading="lazy" class="w-full h-32 md:h-36 object-cover bg-gray-200">'
                    + '<div class="p-2">' + chip(im.tipo) + '<p class="text-sm text-gray-800 leading-snug mt-1">' + im.label + '</p></div></button>').join('') + '</div>'
                    + '<p class="text-xs text-gray-500 mt-3">Imágenes de referencia de PathologyOutlines.com y DermNet, con fines docentes. Créditos en cada imagen.</p>';
                body.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => ver(+b.dataset.i)));
                if (window.lucide) lucide.createIcons();
            }

            function ver(i) {
                const im = lista[i];
                back.classList.remove('hidden'); back.classList.add('flex');
                body.innerHTML = '<div class="flex flex-col items-center">'
                    + '<img src="' + im.url + '" alt="' + im.label + '" class="max-w-full max-h-[65vh] object-contain rounded">'
                    + '<div class="w-full flex flex-wrap items-center justify-between gap-2 mt-3">'
                    + '<div class="flex items-center gap-2">' + chip(im.tipo) + '<span class="text-sm md:text-base text-gray-800 font-semibold">' + im.label + '</span></div>'
                    + '<div class="flex items-center gap-3 text-xs text-gray-500"><span>' + im.fuente + '</span>'
                    + '<a href="' + im.url + '" target="_blank" class="text-purple-700 underline">Abrir original</a></div></div>'
                    + '<div class="flex gap-2 mt-3">'
                    + (i > 0 ? '<button type="button" data-n="' + (i - 1) + '" class="px-3 py-1.5 rounded-lg border text-sm text-purple-800">← Anterior</button>' : '')
                    + (i < lista.length - 1 ? '<button type="button" data-n="' + (i + 1) + '" class="px-3 py-1.5 rounded-lg border text-sm text-purple-800">Siguiente →</button>' : '')
                    + '</div></div>';
                body.querySelectorAll('button[data-n]').forEach(b => b.addEventListener('click', () => ver(+b.dataset.n)));
                body.dataset.i = i;
            }

            function cerrar() { modal.classList.add('hidden'); modal.classList.remove('flex'); body.innerHTML = ''; delete body.dataset.i; }

            window.openImagenes = function () {
                const c = slides[currentSlide].content;
                lista = c.imagenes || [];
                if (!lista.length) return;
                title.textContent = 'Imágenes · ' + c.title;
                modal.classList.remove('hidden'); modal.classList.add('flex');
                grid();
            };

            back.addEventListener('click', grid);
            modal.querySelector('#imgClose').addEventListener('click', cerrar);
            modal.addEventListener('click', (e) => { if (e.target === modal) cerrar(); });
            // Con el modal abierto, las flechas recorren imágenes y no cambian de lámina
            window.addEventListener('keydown', (e) => {
                if (modal.classList.contains('hidden')) return;
                e.stopPropagation();
                if (e.key === 'Escape') cerrar();
                else if (body.dataset.i !== undefined && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                    const n = +body.dataset.i + (e.key === 'ArrowRight' ? 1 : -1);
                    if (n >= 0 && n < lista.length) ver(n);
                }
            }, true);
        })();
</script>
