                    title: 'Conceptos Fundamentales',

                    items: [
                        '🧱 <strong>Ateroesclerosis:</strong> placa de lípidos, células espumosas y fibrosis en la íntima arterial. Estrecha la luz y, al romperse, expone material trombogénico',
                        '🩸 <strong>Trombosis:</strong> coágulo formado dentro del vaso en vida. La tríada de Virchow reúne sus tres condiciones: daño endotelial, flujo anormal e hipercoagulabilidad',
                        '🚀 <strong>Embolia:</strong> material que viaja por la circulación y ocluye un vaso distante. Casi siempre es un trombo desprendido',
                        '💀 <strong>Infarto:</strong> necrosis de un territorio por interrupción del flujo. Es blanco en órganos sólidos con circulación terminal y rojo cuando el tejido tiene doble irrigación o se reperfunde'
                    ]
                }
            },
            // 4 - Comparación
            {
                type: 'comparison',
                content: {
                    title: 'Trombo Arterial vs. Trombo Venoso',
                    subtitle: 'Dónde se forma condiciona cómo se ve y a dónde llega',
                    comparison: {
                        headers: ['Característica', 'Arterial', 'Venoso'],
                        rows: [
                            ['Mecanismo dominante', 'Daño endotelial, habitualmente sobre una placa de ateroma', 'Estasis del flujo, por inmovilidad o compresión'],
                            ['Composición', 'Rico en plaquetas y fibrina; pálido y firme', 'Rico en eritrocitos atrapados en fibrina; rojo y friable'],
                            ['Flujo', 'Se forma contra un flujo rápido', 'Se forma en un flujo lento o detenido'],
                            ['Consecuencia local', 'Isquemia e infarto del territorio distal', 'Congestión y edema del territorio proximal'],
                            ['Destino del émbolo', 'Circulación sistémica: cerebro, riñón, bazo, extremidades', 'Circulación pulmonar: tromboembolismo pulmonar'],
                            ['Prevención habitual', 'Antiagregantes plaquetarios', 'Anticoagulantes']
                        ]
                    }
                }
            },
            // 5 - Metodología

                    title: 'Metodología de Trabajo',

                        '🔬 Recorran primero a bajo aumento y comparen siempre contra la histología normal del mismo órgano',
                        '🔍 Los enlaces de apoyo de cada caso están al pie de la lámina: úsenlos durante la sesión',
                        '📝 Registren los hallazgos y capturas del grupo: son su material de estudio para la prueba práctica',
                        '❓ El docente circula orientando; al cierre se hace la puesta en común'
                    ]

        function createPagination() {

                const dot = document.createElement('button');

                dot.addEventListener('click', () => goToSlide(i));
                pagination.appendChild(dot);
            }
            paginationMobile.innerHTML = '';
            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-smooth ${i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400'}`;

        }
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtnMobile = document.getElementById('prevBtnMobile');
            const nextBtnMobile = document.getElementById('nextBtnMobile');
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
            prevBtnMobile.disabled = currentSlide === 0;
            nextBtnMobile.disabled = currentSlide === slides.length - 1;
            createPagination();
        }
        function previousSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
                updateNavigation();
            }
        }
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
                updateNavigation();
            }
        }
        function goToSlide(index) {
            if (index >= 0 && index < slides.length) {
                currentSlide = index;
                renderSlide();
                updateNavigation();
            }
        }
        document.getElementById('prevBtn').addEventListener('click', previousSlide);
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtnMobile').addEventListener('click', previousSlide);
        document.getElementById('nextBtnMobile').addEventListener('click', nextSlide);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                previousSlide();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
            } else if (e.key === 'Home') {
                goToSlide(0);
            } else if (e.key === 'End') {
                goToSlide(slides.length - 1);
            }
        });
    
        // Pantalla completa: boton del header y tecla F
        (function () {
            const fsBtn = document.getElementById('fullscreenBtn');
            if (!fsBtn) return;
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }
            fsBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                const icon = document.fullscreenElement ? 'minimize' : 'maximize';
                fsBtn.innerHTML = '<i data-lucide="' + icon + '" class="w-5 h-5 text-yellow-400"></i>';
                fsBtn.title = document.fullscreenElement ? 'Salir de pantalla completa (F)' : 'Pantalla completa (F)';
                if (window.lucide) lucide.createIcons();
            });
            document.addEventListener('keydown', (e) => {
                if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const t = e.target.tagName;
                    if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
                    e.preventDefault();
                    toggleFullscreen();
                }
            });
        })();
