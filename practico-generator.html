<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Prácticos - DigitalDuck</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; background:#f9f4f2; }
  .tab-btn.active { background:#4c1d95; color:white; }
  .field-label { display:block; font-size:0.8rem; font-weight:600; color:#4b5563; margin-bottom:0.25rem; }
  .field-input { width:100%; border:1px solid #d1d5db; border-radius:0.5rem; padding:0.5rem 0.75rem; font-size:0.9rem; }
  .field-input:focus { outline:2px solid #7c3aed; outline-offset:1px; }
  .slide-card { border:1px solid #e5e7eb; }
  .slide-card.selected { border-color:#7c3aed; box-shadow:0 0 0 2px #ddd6fe; }
  .type-btn { border:1px solid #e5e7eb; transition:all .15s; }
  .type-btn:hover { border-color:#7c3aed; background:#f5f3ff; }
</style>
</head>
<body>
<div class="max-w-7xl mx-auto p-4 md:p-6">

  <header class="bg-purple-900 text-white rounded-xl p-4 md:p-5 mb-5 flex flex-wrap items-center justify-between gap-3 shadow-lg">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-1 text-yellow-400 hover:text-yellow-200 transition-smooth flex-shrink-0" title="Volver al portal">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </a>
      <i data-lucide="microscope" class="w-7 h-7 text-yellow-400"></i>
      <div>
        <h1 class="font-bold text-lg md:text-xl">Generador de Prácticos - DigitalDuck</h1>
        <p class="text-purple-200 text-xs md:text-sm">Crea un práctico digital interactivo sin programar</p>
      </div>
    </div>
    <div class="flex gap-2 flex-wrap items-center">
      <button id="btnCambiarModo" style="display:none" class="bg-purple-800 hover:bg-purple-700 text-sm px-3 py-2 rounded-lg flex items-center gap-1">
        <i data-lucide="repeat" class="w-4 h-4"></i> Cambiar de modo
      </button>
      <div id="headerActionsFull" style="display:none" class="flex gap-2 flex-wrap items-center">
        <button id="btnCargarHTML" class="bg-purple-800 hover:bg-purple-700 text-sm px-3 py-2 rounded-lg flex items-center gap-1">
          <i data-lucide="upload" class="w-4 h-4"></i> Cargar HTML
        </button>
        <button id="btnCargarJSON" class="bg-purple-800 hover:bg-purple-700 text-sm px-3 py-2 rounded-lg flex items-center gap-1">
          <i data-lucide="file-json" class="w-4 h-4"></i> Cargar JSON
        </button>
        <input type="file" id="fileHtmlInput" accept=".html,.htm" class="hidden">
        <input type="file" id="fileJsonInput" accept=".json" class="hidden">
        <button id="btnNuevo" class="bg-purple-800 hover:bg-purple-700 text-sm px-3 py-2 rounded-lg flex items-center gap-1">
          <i data-lucide="file-plus" class="w-4 h-4"></i> Nuevo
        </button>
        <span id="autosaveIndicator" class="text-xs text-purple-300 self-center hidden md:inline"></span>
      </div>
    </div>
  </header>

  <nav class="flex gap-2 mb-5 flex-wrap" id="tabNav"></nav>

  <main id="tabContent" class="bg-white rounded-xl shadow p-4 md:p-6 min-h-[400px]"></main>

</div>

};

/* Arma la línea de "Paciente" a partir de los campos clínicos estructurados (todos
   opcionales); si ninguno está lleno, usa el texto libre (compatibilidad con las
   láminas existentes, que solo tienen clinical.patient). Esta misma lógica está
   duplicada, en forma local, dentro de getSlideHTML — ver comentario ahí. */
function composePatientLine(clinical) {
  if (!clinical) return '';
  const structured = clinical.edad || clinical.sexo || clinical.sitioBiopsia || clinical.tipoBiopsia;
  if (!structured) return clinical.patient || '';
  let base = '';
  if (clinical.sexo && clinical.edad) base = clinical.sexo + ' de ' + clinical.edad + ' años';
  else if (clinical.sexo) base = clinical.sexo;
  else if (clinical.edad) base = clinical.edad + ' años';
  let bx = '';
  if (clinical.tipoBiopsia && clinical.sitioBiopsia) bx = 'biopsia ' + clinical.tipoBiopsia + ' de ' + clinical.sitioBiopsia;
  else if (clinical.tipoBiopsia) bx = 'biopsia ' + clinical.tipoBiopsia;
  else if (clinical.sitioBiopsia) bx = 'biopsia de ' + clinical.sitioBiopsia;
  return [base, bx].filter(Boolean).join(', ');
}

/* Laboratorio y Estudios de imagen admiten un link opcional (ej. al informe o la
   imagen). Guardados como {value, url}; se acepta también el string legacy (láminas
   antiguas) sin url. Mismas funciones duplicadas localmente dentro de getSlideHTML. */
function labsFieldValue(v) { return (v && typeof v === 'object') ? (v.value || '') : (v || ''); }
function labsFieldUrl(v) { return (v && typeof v === 'object') ? (v.url || '') : ''; }
function ensureLabsShape(clinical) {
  if (!clinical) return;
  ['labs', 'imagenologia'].forEach(key => {
    const v = clinical[key];
    if (!v || typeof v !== 'object') clinical[key] = {value: labsFieldValue(v), url: ''};
  });
}

function validateSlide(slide) {
  const c = slide.content || {};
  const issues = [];
  const reqText = (val, label) => { if (!val || !String(val).trim()) issues.push(label); };
  const reqList = (arr, label) => { if (!arr || !arr.length) issues.push(label); };
  switch (slide.type) {
    case 'title':
      reqText(c.title,'Título'); reqText(c.instructor,'Instructor/a'); reqText(c.email,'Email'); break;
    case 'objectives':
      reqText(c.title,'Título'); reqList(c.items,'Objetivos'); break;
    case 'content':
      reqText(c.title,'Título'); reqList(c.items,'Puntos'); break;
    case 'process':
      reqText(c.title,'Título'); reqList(c.steps,'Pasos'); break;
    case 'platform':
      reqText(c.title,'Título'); reqText(c.url,'URL'); reqList(c.features,'Características'); break;
    case 'tutorial':
      reqText(c.title,'Título'); reqList(c.steps,'Pasos'); break;
    case 'activity':
      reqText(c.title,'Título'); reqList(c.instructions,'Instrucciones'); break;
    case 'case':
      reqText(c.title,'Título'); reqText(c.concept,'Concepto');
      if (c.clinical) {
        const cl = c.clinical;
        if (!cl.patient && !cl.edad && !cl.sexo && !cl.sitioBiopsia && !cl.tipoBiopsia) issues.push('Información del paciente');
        reqText(cl.symptoms,'Síntomas');
        if (!labsFieldValue(cl.labs) && !labsFieldValue(cl.imagenologia)) issues.push('Laboratorio o estudios de imagen');
      } else issues.push('Información clínica');
      reqList(c.questions,'Preguntas'); reqList(c.links,'Enlaces');
      break;
    case 'comparison':
      reqText(c.title,'Título');
      if (!c.headers || c.headers.length < 2) issues.push('Encabezados (mínimo 2)');
      reqList(c.rows,'Filas');
      break;
    case 'assessment':
      reqText(c.title,'Título'); reqList(c.items,'Evaluaciones'); break;
    case 'resources':
      reqText(c.title,'Título'); reqList(c.platforms,'Recursos'); break;
    case 'qa':
      reqText(c.title,'Título');
      if (c.contact) reqText(c.contact.email,'Email de contacto');
      else issues.push('Contacto');
      break;
  }
  return issues;
}

function defaultContent(type) {
  switch(type) {
    case 'title': return {title:'', subtitle:'', instructor: state.meta.instructor||'', email: state.meta.email||''};
    case 'objectives': return {title:'Objetivos del Práctico', items:[]};
    case 'content': return {title:'', subtitle:'', items:[]};
    case 'process': return {title:'', subtitle:'', image:'', steps:[]};
    case 'platform': return {title:'', url:'', features:[]};
    case 'tutorial': return {title:'', steps:[]};

/* ================= HELPERS ================= */

function getPath(obj, path) {
  return path.split('.').reduce((o,k) => (o==null? o : o[k]), obj);
}
function setPath(obj, path, value) {
  const parts = path.split('.');
  let o = obj;
  for (let i=0; i<parts.length-1; i++) {
    if (!o[parts[i]]) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = value;
}
function escAttr(s) {
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escHtml(s) {
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function listToText(arr) { return (arr||[]).join('\n'); }
function textToList(txt) { return txt.split('\n').map(s=>s.trim()).filter(Boolean); }
function csvToList(txt) { return txt.split(',').map(s=>s.trim()).filter(Boolean); }

function render() {
  const nav = document.getElementById('tabNav');
  const btnModo = document.getElementById('btnCambiarModo');
  const headerFull = document.getElementById('headerActionsFull');
  btnModo.style.display = genMode === null ? 'none' : 'inline-flex';

  if (genMode === null) {
    nav.innerHTML = '';
    document.getElementById('tabContent').innerHTML = renderModeSelector();
    wireModeSelector();
    lucide.createIcons();
    return;
  }
  if (genMode === 'quick') {
    nav.innerHTML = '';

    wireQuickCase();
    lucide.createIcons();
    return;

  nav.innerHTML = TABS.map(t => `

  const content = document.getElementById('tabContent');

  else if (activeTab === 'laminas') content.innerHTML = renderTabLaminas();
  else if (activeTab === 'generar') content.innerHTML = renderTabGenerar();

  lucide.createIcons();
}

function addQuickCaseToPractico(file) {
  const issues = validateSlide({type:'case', content: quickCase});
  if (issues.length && !confirm('La lámina tiene campos incompletos (' + issues.join(', ') + '). ¿Agregarla de todas formas?')) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    const found = extractSlidesBlock(text);
    if (!found) { alert('No se encontró el arreglo de láminas en este archivo. ¿Es un práctico de DigitalDuck?'); return; }
    const newSlide = {type:'case', content: JSON.parse(JSON.stringify(quickCase))};
    const updatedSlides = found.slides.concat([newSlide]);
    const updatedText = text.slice(0, found.arrStart) + JSON.stringify(updatedSlides, null, 4) + text.slice(found.arrEnd + 1);
    downloadBlob(updatedText, file.name, 'text/html');
    alert('Lámina agregada al final de "' + file.name + '". Reemplaza el archivo original en el proyecto con esta descarga.');
  };
  reader.onerror = () => alert('No se pudo leer el archivo.');
  reader.readAsText(file);
}

}

function upsertSlideOfType(type, contentPatch, insertAt) {
  let idx = state.slides.findIndex(s => s.type === type);
  if (idx === -1) {
    const slide = {type, content: Object.assign(defaultContent(type), contentPatch)};
    if (insertAt === 'start') state.slides.unshift(slide);
    else if (insertAt === 'end') state.slides.push(slide);
    else state.slides.push(slide);
  } else {
    Object.assign(state.slides[idx].content, contentPatch);
  }
}

/* ================= TAB 3: LAMINAS ================= */

function renderTabLaminas() {
  if (editingIndex !== null && state.slides[editingIndex]) {
    return renderSlideEditor(editingIndex);
  }
  if (libraryOpen) {
    return renderLibraryBrowser();
  }
  const featured = SLIDE_TYPES.find(t => t.featured);
  const rest = SLIDE_TYPES.filter(t => !t.featured);
  return `
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-gray-800">Secciones del práctico (${state.slides.length})</h2>
    </div>

    <div class="border-t pt-4">
      <p class="field-label mb-2">Agregar sección</p>
      <button class="type-btn rounded-lg p-4 mb-3 w-full flex items-center gap-3 text-left" style="border-width:2px; border-color:#c4b5fd; background:#f5f3ff;" data-add-type="${featured.id}">
        <i data-lucide="${featured.icon}" class="w-6 h-6 text-purple-700 flex-shrink-0"></i>
        <div>
          <span class="block text-sm font-bold text-purple-800">${featured.label}</span>
          <span class="block text-xs text-purple-600">El corazón del práctico — elige de la biblioteca o crea una nueva</span>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="addSlideGrid">
        ${rest.map(t => `
          <button class="type-btn rounded-lg p-3 text-left flex items-center gap-2" data-add-type="${t.id}">
            <i data-lucide="${t.icon}" class="w-5 h-5 text-purple-600 flex-shrink-0"></i>
            <span class="text-sm text-gray-700">${t.label}</span>
          </button>
        `).join('')}
      </div>

function renderLibraryBrowser() {
  const filter = (libraryFilter || '').toLowerCase().trim();
  const matches = (l) => !filter || (l.title + ' ' + (l.concept||'') + ' ' + (l.temaNombre||'')).toLowerCase().includes(filter);

  let html = '';
  CURRICULUM_TAXONOMY.unidades.forEach(u => {
    const temasConCasos = u.temas.filter(t => LAMINAS_BANK.some(l => l.temaId === t.id && matches(l)));
    if (!temasConCasos.length) return;
    html += `<div class="mb-5"><p class="text-xs font-bold text-purple-700 uppercase tracking-wide mb-2">Unidad ${u.numero}: ${u.nombre}</p>`;
    temasConCasos.forEach(t => {
      const laminas = LAMINAS_BANK.filter(l => l.temaId === t.id && matches(l));
      html += `<p class="text-xs text-gray-500 mb-1 ml-1">${t.nombre}</p><div class="grid md:grid-cols-2 gap-2 mb-3">`;
      laminas.forEach(l => {
        html += `
          <div class="border rounded-lg p-3 bg-gray-50 flex items-start justify-between gap-2">
            <div class="min-w-0">
              <p class="text-sm font-semibold text-gray-800 truncate">${escHtml(l.title)}</p>
              <p class="text-xs text-gray-500 truncate">${escHtml(composePatientLine(l.clinical))}</p>
            </div>
            <button class="flex-shrink-0 bg-purple-600 hover:bg-purple-700 text-white text-xs px-2 py-1.5 rounded font-medium" data-pick-lamina="${l.id}">+ Agregar</button>
          </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });
  if (!html) html = '<p class="text-sm text-gray-400">Sin resultados para ese filtro.</p>';

  return `
    <div class="flex items-center gap-2 mb-4">
      <button id="btnVolverDeLibreria" class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
      <h2 class="text-lg font-bold text-gray-800">Elegir lámina de la biblioteca (${LAMINAS_BANK.length} casos)</h2>
    </div>
    <div class="flex gap-2 mb-4">
      <input class="field-input" id="libraryFilterInput" placeholder="Buscar por tema, concepto o título..." value="${escAttr(libraryFilter||'')}">
      <button id="btnCrearLaminaBlanco" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">+ Nueva en blanco</button>
    </div>
    <div class="max-h-[55vh] overflow-y-auto pr-1">${html}</div>
  `;
}

function refreshLibraryBrowser() {
  const content = document.getElementById('tabContent');
  content.innerHTML = renderLibraryBrowser();
  wireLibraryBrowserEvents();
  lucide.createIcons();
  const inp = document.getElementById('libraryFilterInput');
  if (inp) { inp.focus(); const p = inp.value.length; inp.setSelectionRange(p, p); }
}

function wireLibraryBrowserEvents() {
  const filterInput = document.getElementById('libraryFilterInput');
  if (filterInput) {
    filterInput.addEventListener('input', () => {
      libraryFilter = filterInput.value;
      refreshLibraryBrowser();
    });
  }
  document.querySelectorAll('[data-pick-lamina]').forEach(btn => {
    btn.addEventListener('click', () => {
      const bankItem = LAMINAS_BANK.find(l => l.id === btn.dataset.pickLamina);
      if (!bankItem) return;
      const content = JSON.parse(JSON.stringify({
        title: bankItem.title, concept: bankItem.concept, clinical: bankItem.clinical,
        questions: bankItem.questions, links: bankItem.links
      }));
      state.slides.push({type: 'case', content});
      libraryOpen = false;
      saveDraft();
      render();
    });
  });
  const btnVolver = document.getElementById('btnVolverDeLibreria');
  if (btnVolver) btnVolver.addEventListener('click', () => { libraryOpen = false; render(); });
  const btnBlanco = document.getElementById('btnCrearLaminaBlanco');
  if (btnBlanco) btnBlanco.addEventListener('click', () => {
    state.slides.push({type: 'case', content: defaultContent('case')});
    libraryOpen = false;
    editingIndex = state.slides.length - 1;
    saveDraft();
    render();
  });
}

function renderSlideList() {
  const wrap = document.getElementById('slideList');
  if (!wrap) return;
  if (state.slides.length === 0) {
    wrap.innerHTML = '<p class="text-sm text-gray-400">Aún no hay secciones. Agrega una abajo.</p>';
    return;
  }
  wrap.innerHTML = state.slides.map((s,i) => {
    const typeInfo = SLIDE_TYPES.find(t => t.id === s.type) || {label:s.type, icon:'file'};
    const title = s.content.title || '(sin título)';
    const issues = validateSlide(s);
    const warn = issues.length ? `<span title="Falta: ${escAttr(issues.join(', '))}" class="flex items-center gap-1 text-amber-600 flex-shrink-0"><i data-lucide="alert-triangle" class="w-4 h-4"></i></span>` : '';
    return `
      <div class="slide-card rounded-lg p-3 flex items-center gap-3">
        <span class="text-xs font-mono text-gray-400 w-6">${i+1}</span>
        <i data-lucide="${typeInfo.icon}" class="w-5 h-5 text-purple-600 flex-shrink-0"></i>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-800 truncate">${escHtml(title)}</p>
          <p class="text-xs text-gray-400">${typeInfo.label}</p>
        </div>
        ${warn}
        <button class="p-1.5 hover:bg-gray-100 rounded" data-move-up="${i}" title="Subir"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
        <button class="p-1.5 hover:bg-gray-100 rounded" data-move-down="${i}" title="Bajar"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
        <button class="p-1.5 hover:bg-purple-100 rounded text-purple-700" data-edit="${i}" title="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></button>
        <button class="p-1.5 hover:bg-red-100 rounded text-red-600" data-delete="${i}" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('[data-move-up]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.moveUp; if (i>0) { [state.slides[i-1],state.slides[i]]=[state.slides[i],state.slides[i-1]]; saveDraft(); renderSlideList(); lucide.createIcons(); }
  }));
  wrap.querySelectorAll('[data-move-down]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.moveDown; if (i<state.slides.length-1) { [state.slides[i+1],state.slides[i]]=[state.slides[i],state.slides[i+1]]; saveDraft(); renderSlideList(); lucide.createIcons(); }
  }));
  wrap.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
    editingIndex = +b.dataset.edit; render();
  }));
  wrap.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => {
    if (confirm('¿Eliminar esta lámina?')) { state.slides.splice(+b.dataset.delete,1); saveDraft(); renderSlideList(); lucide.createIcons(); }
  }));
  lucide.createIcons();
}

/* Layout dedicado del tipo 'case': agrupa edad/sexo y tipo/sitio de biopsia en la misma
   fila, y laboratorio/imagenología junto a su link opcional, para no alargar tanto el
   formulario. fieldAttr es 'data-slide-field' (editor completo) o 'data-qc-field' (caso
   rápido) — ambos wiring loops ya existen y leen ese atributo, no hace falta cablear nada
   nuevo aquí. */
function renderCaseFields(content, fieldAttr) {
  if (!content.clinical) content.clinical = {};
  ensureLabsShape(content.clinical);
  const val = (path) => escAttr(getPath(content, path) || '');
  const dl = (path) => DATALIST_FOR_PATH[path] ? ` list="${DATALIST_FOR_PATH[path]}"` : '';
  const field = (path, label) => `<div class="mb-3"><label class="field-label">${label}</label><input class="field-input" ${fieldAttr}="${path}" data-slide-type="text"${dl(path)} value="${val(path)}"></div>`;
  return `
    ${field('title', 'Título (ej. Metaplasia Intestinal — sin número, el orden lo da la posición en el práctico)')}
    ${field('concept', 'Concepto clave (ej. METAPLASIA)')}
    <div class="grid md:grid-cols-2 gap-x-3">
      ${field('clinical.edad', 'Edad (opcional)')}
      ${field('clinical.sexo', 'Sexo (opcional)')}
    </div>
    <div class="grid md:grid-cols-2 gap-x-3">
      ${field('clinical.tipoBiopsia', 'Tipo de biopsia (opcional)')}
      ${field('clinical.sitioBiopsia', 'Sitio de la biopsia (opcional)')}
    </div>
    ${field('clinical.patient', 'Paciente — texto libre (opcional si ya llenaste edad/sexo/sitio/tipo arriba)')}
    ${field('clinical.symptoms', 'Síntomas')}
    <div class="grid md:grid-cols-3 gap-x-3">
      <div class="md:col-span-2">${field('clinical.labs.value', 'Laboratorio')}</div>
      ${field('clinical.labs.url', 'Link (opcional)')}
    </div>
    <div class="grid md:grid-cols-3 gap-x-3">
      <div class="md:col-span-2">${field('clinical.imagenologia.value', 'Estudios de imagen (opcional)')}</div>
      ${field('clinical.imagenologia.url', 'Link (opcional)')}
    </div>
  `;
}

function renderSlideEditor(i) {
  const slide = state.slides[i];
  const typeInfo = SLIDE_TYPES.find(t => t.id === slide.type);
  const simple = SIMPLE_FIELDS[slide.type] || [];
  const objlist = OBJLIST_FIELDS[slide.type];

  let fieldsHtml = (slide.type === 'case' ? renderCaseFields(slide.content, 'data-slide-field') : '') + simple.map(([path,label,ftype]) => {
    const val = getPath(slide.content, path);
    if (ftype === 'chiplist') {
      return `<div class="mb-3" data-chipfield="${path}"><label class="field-label">${label}</label><div id="chipsBox_${path.replace(/\./g,'_')}"></div></div>`;
    }
    if (ftype === 'list') {
      return `<div class="mb-3"><label class="field-label">${label}</label><textarea class="field-input" rows="4" data-slide-field="${path}" data-slide-type="list">${escHtml(listToText(val))}</textarea></div>`;
    }
    if (ftype === 'csv') {
      return `<div class="mb-3"><label class="field-label">${label}</label><input class="field-input" data-slide-field="${path}" data-slide-type="csv" value="${escAttr((val||[]).join(', '))}"></div>`;
    }
    const listAttr = DATALIST_FOR_PATH[path] ? ` list="${DATALIST_FOR_PATH[path]}"` : '';
    return `<div class="mb-3"><label class="field-label">${label}</label><input class="field-input" data-slide-field="${path}" data-slide-type="text" value="${escAttr(val)}"${listAttr}></div>`;
  }).join('');

  let objlistHtml = '';
  if (objlist) {
    const quickLinksBox = slide.type === 'case' ? `<div id="quickLinksBox"></div>` : '';
    objlistHtml = `<div class="mb-3 border-t pt-3">
      <label class="field-label mb-2">${objlist.label}</label>
      ${quickLinksBox}
      <div id="objlistItems"></div>
      <button id="btnAddObjItem" class="mt-2 text-sm text-purple-700 hover:text-purple-900 flex items-center gap-1">
        <i data-lucide="plus" class="w-4 h-4"></i> Agregar ${objlist.itemLabel.toLowerCase()}
      </button>
    </div>`;
  }

  let comparisonHtml = '';
  if (slide.type === 'comparison') {
    comparisonHtml = `<div class="mb-3 border-t pt-3">
      <label class="field-label mb-2">Filas (una celda por columna)</label>
      <div id="comparisonRows"></div>
      <button id="btnAddRow" class="mt-2 text-sm text-purple-700 hover:text-purple-900 flex items-center gap-1">
        <i data-lucide="plus" class="w-4 h-4"></i> Agregar fila
      </button>
    </div>`;
  }

  return `
    <div class="flex items-center gap-2 mb-4">
      <button id="btnVolverLista" class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
      <i data-lucide="${typeInfo.icon}" class="w-5 h-5 text-purple-600"></i>
      <h2 class="text-lg font-bold text-gray-800">Editando: ${typeInfo.label} (lámina ${i+1})</h2>
    </div>
    <div class="max-w-3xl">
      ${fieldsHtml}
      ${objlistHtml}
      ${comparisonHtml}
    </div>
    <button id="btnGuardarLamina" class="mt-4 bg-purple-700 hover:bg-purple-800 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
      <i data-lucide="check" class="w-4 h-4"></i> Guardar y volver
    </button>
  `;
}

function renderObjListItemsGeneric(items, fields, wrapId, persist) {
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  wrap.innerHTML = items.map((item, idx) => `
    <div class="bg-gray-50 p-3 rounded-lg mb-2 flex gap-2 items-start flex-wrap">
      ${fields.map(([key,label]) => `
        <div class="flex-1 min-w-[120px]">
          <label class="text-xs text-gray-500">${label}</label>
          <input class="field-input" data-oli-field="${idx}.${key}" value="${escAttr(item[key])}">
        </div>
      `).join('')}
      <button class="p-2 text-red-500 hover:text-red-700 self-end" data-oli-remove="${idx}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
  `).join('') || '<p class="text-sm text-gray-400 mb-2">Sin elementos aún.</p>';

  wrap.querySelectorAll('[data-oli-field]').forEach(inp => {
    inp.addEventListener('input', () => {
      const [idx,key] = inp.dataset.oliField.split('.');
      items[+idx][key] = inp.value;
      persist();
    });
  });
  wrap.querySelectorAll('[data-oli-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      items.splice(+btn.dataset.oliRemove, 1);
      persist();
      renderObjListItemsGeneric(items, fields, wrapId, persist);
      lucide.createIcons();
    });
  });
  lucide.createIcons();
}

function renderObjListItems(i) {
  const slide = state.slides[i];
  const objlist = OBJLIST_FIELDS[slide.type];
  if (!objlist) return;
  const items = slide.content[objlist.key] || (slide.content[objlist.key] = []);
  if (slide.type === 'case') {
    renderLinksField(items, objlist.fields, 'quickLinksBox', 'objlistItems', saveDraft);
  } else {
    renderObjListItemsGeneric(items, objlist.fields, 'objlistItems', saveDraft);
  }
}

/* Botones "+ Fuente" que agregan el enlace home de una fuente recomendada (referencial;
   el docente puede usar otras). Se ocultan una vez agregadas para no duplicar. */
function renderQuickLinkButtonsHTML(items) {
  const present = new Set((items||[]).map(l => l.label));
  const avail = QUICK_LINKS.filter(q => !present.has(q.label));
  if (!avail.length) return '';
  return `<div class="mb-2">
    <p class="text-xs text-gray-500 mb-1">Fuentes rápidas (referenciales — agrega el home, tú buscas y ajustas el enlace al caso; puedes usar otras fuentes):</p>
    <div class="flex flex-wrap gap-2">
      ${avail.map(q => `<button data-quicklink="${escAttr(q.label)}" data-quicklink-url="${escAttr(q.url)}" title="${escAttr(q.hint)}" class="border border-blue-300 text-blue-700 hover:bg-blue-50 text-xs px-2.5 py-1 rounded-full">+ ${escHtml(q.label)}</button>`).join('')}
    </div>
  </div>`;
}

function renderLinksField(items, fields, quickBoxId, objBoxId, persist) {
  const onChange = () => { persist(); renderLinksField(items, fields, quickBoxId, objBoxId, persist); };
  const quickBox = document.getElementById(quickBoxId);
  if (quickBox) {
    quickBox.innerHTML = renderQuickLinkButtonsHTML(items);
    quickBox.querySelectorAll('[data-quicklink]').forEach(btn => {
      btn.addEventListener('click', () => {
        items.push({label: btn.dataset.quicklink, url: btn.dataset.quicklinkUrl});
        onChange();
      });
    });
    lucide.createIcons();
  }

/* Campo de chips reutilizable (preguntas de análisis y, a futuro, otras listas cortas).
   obj/path apuntan al dato real; boxId es el contenedor; persist guarda el cambio. */
function renderChipsField(obj, path, boxId, persist) {
  const box = document.getElementById(boxId);
  if (!box) return;
  const selected = getPath(obj, path) || [];
  const custom = loadCustomQuestions();
  const bank = PRESET_QUESTIONS.concat(custom.filter(q => !PRESET_QUESTIONS.includes(q)));
  const available = bank.filter(q => !selected.includes(q));
  const rerender = () => renderChipsField(obj, path, boxId, persist);

  box.innerHTML = `
    <div class="flex flex-wrap gap-2 mb-2">
      ${selected.map((q,qi) => `
        <span class="bg-purple-100 text-purple-800 text-sm px-3 py-1.5 rounded-full flex items-center gap-2">
          ${escHtml(q)}
          <button data-chip-remove="${qi}" class="text-purple-500 hover:text-purple-800 font-bold">&times;</button>
        </span>
      `).join('') || '<p class="text-sm text-gray-400">Sin preguntas aún.</p>'}
    </div>
    ${available.length ? `<p class="text-xs text-gray-500 mb-1">Frecuentes:</p>
    <div class="flex flex-wrap gap-2 mb-2">
      ${available.map(q => `<button data-chip-preset="${escAttr(q)}" class="border border-purple-300 text-purple-700 hover:bg-purple-50 text-xs px-2.5 py-1 rounded-full">+ ${escHtml(q)}</button>`).join('')}
    </div>` : ''}
    <div class="flex gap-2 items-center">
      <input class="field-input" data-chip-custom-input placeholder="Escribe una pregunta propia y presiona +">
      <button data-chip-custom-add class="bg-purple-700 hover:bg-purple-800 text-white px-3 py-2 rounded-lg text-sm flex-shrink-0">+</button>
    </div>
    <label class="flex items-center gap-1 text-xs text-gray-500 mt-1">
      <input type="checkbox" data-chip-save-custom checked> Guardar en mis preguntas frecuentes (solo este navegador)
    </label>
  `;

  box.querySelectorAll('[data-chip-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      selected.splice(+btn.dataset.chipRemove, 1);
      setPath(obj, path, selected);
      persist(); rerender();
    });
  });
  box.querySelectorAll('[data-chip-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      selected.push(btn.dataset.chipPreset);
      setPath(obj, path, selected);
      persist(); rerender();
    });
  });
  const commit = () => {
    const input = box.querySelector('[data-chip-custom-input]');
    const saveCk = box.querySelector('[data-chip-save-custom]');
    const val = input.value.trim();
    if (!val) return;
    selected.push(val);
    setPath(obj, path, selected);
    if (saveCk.checked) saveCustomQuestion(val);
    persist(); rerender();
  };
  box.querySelector('[data-chip-custom-add]').addEventListener('click', commit);
  box.querySelector('[data-chip-custom-input]').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
  });
  lucide.createIcons();
}

function renderComparisonRows(i) {
  const slide = state.slides[i];
  const wrap = document.getElementById('comparisonRows');
  if (!wrap) return;
  const headers = slide.content.headers || [];
  const rows = slide.content.rows || (slide.content.rows = []);
  wrap.innerHTML = rows.map((row, ridx) => `
    <div class="bg-gray-50 p-2 rounded-lg mb-2 flex gap-2 items-center flex-wrap">
      ${headers.map((h, cidx) => `
        <input class="field-input" placeholder="${escAttr(h)}" data-row-cell="${ridx}.${cidx}" value="${escAttr(row[cidx])}">
      `).join('')}
      <button class="p-2 text-red-500 hover:text-red-700" data-row-remove="${ridx}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
  `).join('') || '<p class="text-sm text-gray-400 mb-2">Sin filas aún.</p>';

  wrap.querySelectorAll('[data-row-cell]').forEach(inp => {
    inp.addEventListener('input', () => {
      const [ridx,cidx] = inp.dataset.rowCell.split('.');
      rows[+ridx][+cidx] = inp.value;
      saveDraft();
    });
  });
  wrap.querySelectorAll('[data-row-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      rows.splice(+btn.dataset.rowRemove, 1);
      saveDraft(); renderComparisonRows(i); lucide.createIcons();
    });
  });
  lucide.createIcons();
}

function getSlideHTML(slide) {
    const linkPalette = [
        {icon:'microscope', color:'purple'}, {icon:'book-open', color:'purple'},
        {icon:'activity', color:'green'}, {icon:'clipboard-plus', color:'green'},
        {icon:'link', color:'blue'}, {icon:'globe', color:'blue'}
    ];
    // Copia local de composePatientLine: esta función se embebe entera vía .toString()
    // en el práctico generado, así que no puede depender de funciones externas.
    function patientLine(clinical) {
        if (!clinical) return '';
        const structured = clinical.edad || clinical.sexo || clinical.sitioBiopsia || clinical.tipoBiopsia;
        if (!structured) return clinical.patient || '';
        let base = '';
        if (clinical.sexo && clinical.edad) base = clinical.sexo + ' de ' + clinical.edad + ' años';
        else if (clinical.sexo) base = clinical.sexo;
        else if (clinical.edad) base = clinical.edad + ' años';
        let bx = '';
        if (clinical.tipoBiopsia && clinical.sitioBiopsia) bx = 'biopsia ' + clinical.tipoBiopsia + ' de ' + clinical.sitioBiopsia;
        else if (clinical.tipoBiopsia) bx = 'biopsia ' + clinical.tipoBiopsia;
        else if (clinical.sitioBiopsia) bx = 'biopsia de ' + clinical.sitioBiopsia;
        return [base, bx].filter(Boolean).join(', ');

    // Copia local de labsFieldValue/labsFieldUrl (mismo motivo: getSlideHTML se embebe
    // entera vía toString()). Acepta tanto {value,url} como el string legacy.
    function fieldVal(v) { return (v && typeof v === 'object') ? (v.value || '') : (v || ''); }

        function handleTouchStart(e) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
        function handleTouchMove(e) {
            const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
            const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
            if (deltaX > deltaY && deltaX > 10) e.preventDefault();
        }
        function handleTouchEnd(e) {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                if (deltaX > 0 && currentSlide > 0) previousSlide();
                else if (deltaX < 0 && currentSlide < slides.length - 1) nextSlide();
            }
        }

        function renderSlide() {
            const slide = slides[currentSlide];
            const container = document.getElementById('slideContent');
            container.innerHTML = getSlideHTML(slide);
            const progress = ((currentSlide + 1) / slides.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            lucide.createIcons();
        }

        function createPagination() {
            const pagination = document.getElementById('pagination');
            const paginationMobile = document.getElementById('paginationMobile');
            pagination.innerHTML = '';
            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = 'w-3 h-3 rounded-full transition-smooth ' + (i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400 hover:bg-purple-300');
                dot.addEventListener('click', () => goToSlide(i));
                pagination.appendChild(dot);
            }
            paginationMobile.innerHTML = '';
            for (let i = 0; i < slides.length; i++) {
                const dot = document.createElement('button');
                dot.className = 'w-2 h-2 rounded-full transition-smooth ' + (i === currentSlide ? 'bg-white scale-125' : 'bg-purple-400');
                dot.addEventListener('click', () => goToSlide(i));
                paginationMobile.appendChild(dot);
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtnMobile = document.getElementById('prevBtnMobile');
            const nextBtnMobile = document.getElementById('nextBtnMobile');
            document.getElementById('slide-counter').textContent = (currentSlide + 1) + ' / ' + slides.length;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
            prevBtnMobile.disabled = currentSlide === 0;
            nextBtnMobile.disabled = currentSlide === slides.length - 1;
            createPagination();
        }

        function previousSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); updateNavigation(); } }
        function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); updateNavigation(); } }
        function goToSlide(index) { if (index >= 0 && index < slides.length) { currentSlide = index; renderSlide(); updateNavigation(); } }

        document.getElementById('prevBtn').addEventListener('click', previousSlide);
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtnMobile').addEventListener('click', previousSlide);
        document.getElementById('nextBtnMobile').addEventListener('click', nextSlide);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousSlide();
            else if (e.key === 'ArrowRight') nextSlide();
            else if (e.key === 'Home') goToSlide(0);
            else if (e.key === 'End') goToSlide(slides.length - 1);
        });`;

  return [
    '<!DOCTYPE html>',
    '<html lang="es">',
    '<head>',
    '<meta charset="UTF-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
    '<title>' + pageTitle + ' - DigitalDuck</title>',
    '<script src="https://cdn.tailwindcss.com"><\/script>',
    '<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"><\/script>',
    '<script>',
    'tailwind.config = { theme: { extend: { animation: { "fade-in": "fadeIn 0.5s ease-in-out", "slide-up": "slideUp 0.3s ease-out" } } } }',
    '<\/script>',
    '<style>' + headStyles + '</style>',
    '</head>',
    '<body>',
    bodyShell,
    '<script>',
    'const slides = ' + slidesJSON + ';',
    engineSource,
    navScript,
    '<\/script>',
    '</body>',
    '</html>'
  ].join('\n');
}

/* ================= DOWNLOAD ================= */

function slugify(s) {
  return (s||'practico').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'practico';
}

function downloadHTML() {
  const html = generateFullHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = slugify(state.meta.title) + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportJSON() {
  downloadBlob(JSON.stringify(state, null, 2), slugify(state.meta.title) + '.json', 'application/json');
}

/* ================= IMPORTAR / RECICLAR ================= */

function findMatchingBracket(text, startIdx) {
  let depth = 0, inString = false, quoteChar = null, escaped = false;
  for (let i = startIdx; i < text.length; i++) {
    const ch = text[i];
    if (inString) {
      if (escaped) escaped = false;
      else if (ch === '\\') escaped = true;
      else if (ch === quoteChar) inString = false;
      continue;
    }
    if (ch === '"' || ch === "'" || ch === '`') { inString = true; quoteChar = ch; continue; }
    if (ch === '[') depth++;
    else if (ch === ']') { depth--; if (depth === 0) return i; }
  }
  return -1;
}

function extractSlidesBlock(text) {
  const marker = 'const slides = ';
  const idx = text.indexOf(marker);
  if (idx === -1) return null;
  const arrStart = idx + marker.length;
  if (text[arrStart] !== '[') return null;
  const arrEnd = findMatchingBracket(text, arrStart);
  if (arrEnd === -1) return null;
  const literalText = text.slice(arrStart, arrEnd + 1);
  try {
    const slides = new Function('"use strict"; return (' + literalText + ');')();
    return {slides: normalizeSlides(slides), arrStart, arrEnd};
  } catch(e) {
    console.error('Error al interpretar el arreglo de láminas', e);
    return null;
  }
}

function extractSlidesFromHTML(text) {
  const found = extractSlidesBlock(text);
  return found ? found.slides : null;
}

/* Prácticos anteriores al generador guardaban los enlaces de "caso" como un objeto
   fijo {caso,histologia,medline,msd}; el generador usa una lista flexible [{label,url}]. */
function normalizeSlides(slides) {
  const legacyLabels = {caso:'Caso Clínico', histologia:'Histología Referencia', medline:'MedlinePlus', msd:'MSD Manuals'};
  return (slides||[]).map(s => {
    if (s.type !== 'case' || !s.content) return s;
    let content = s.content;
    if (content.links && !Array.isArray(content.links)) {
      const linksObj = content.links;
      const newLinks = Object.keys(linksObj).map(k => ({label: legacyLabels[k] || k, url: linksObj[k]}));
      content = Object.assign({}, content, {links: newLinks});
    }
    if (content.clinical) {
      const clinical = Object.assign({}, content.clinical);
      ensureLabsShape(clinical);
      content = Object.assign({}, content, {clinical});
    }
    return content === s.content ? s : Object.assign({}, s, {content});
  });
}

function deriveMetaFromSlides() {
  const titleSlide = state.slides.find(s => s.type === 'title');
  if (titleSlide) {
    state.meta.title = titleSlide.content.title || state.meta.title;
    state.meta.instructor = titleSlide.content.instructor || state.meta.instructor;
    state.meta.email = titleSlide.content.email || state.meta.email;
  }
  const qaSlide = state.slides.find(s => s.type === 'qa');
  if (qaSlide && qaSlide.content.contact) {
    state.meta.email = qaSlide.content.contact.email || state.meta.email;
    state.meta.office = qaSlide.content.contact.office || state.meta.office;
    state.meta.hours = qaSlide.content.contact.hours || state.meta.hours;
  }
  const objSlide = state.slides.find(s => s.type === 'objectives');
  if (objSlide) state.objectives = (objSlide.content.items || []).slice();
  const resSlide = state.slides.find(s => s.type === 'resources');
  if (resSlide) state.bibliography = (resSlide.content.platforms || []).map(p => Object.assign({}, p));
}

function importHTML(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const slides = extractSlidesFromHTML(String(reader.result));
    if (!slides || !Array.isArray(slides)) {
      alert('No se pudo encontrar el arreglo de láminas en este archivo HTML. ¿Es un práctico de DigitalDuck?');
      return;
    }
    if (state.slides.length && !confirm('Esto reemplazará el práctico actual (' + state.slides.length + ' lámina(s)) por las ' + slides.length + ' láminas encontradas en el archivo. ¿Continuar?')) return;
    state.slides = slides;
    deriveMetaFromSlides();
    editingIndex = null;
    activeTab = 'laminas';
    saveDraft();
    render();
    alert('Importado: ' + slides.length + ' lámina(s). Puedes editarlas en la pestaña Láminas.');
  };
  reader.onerror = () => alert('No se pudo leer el archivo.');
  reader.readAsText(file);
}

/* ================= ACTUALIZAR INDICE DEL PORTAL (practicos.html) ================= */

function extractPracticosArray(text) {
  const marker = 'const PRACTICOS = ';
  const idx = text.indexOf(marker);
  if (idx === -1) return null;
  const arrStart = idx + marker.length;
  if (text[arrStart] !== '[') return null;
  const arrEnd = findMatchingBracket(text, arrStart);
  if (arrEnd === -1) return null;
  try {
    const arr = new Function('"use strict"; return (' + text.slice(arrStart, arrEnd + 1) + ');')();
    return {arr, arrStart, arrEnd};
  } catch(e) {
    console.error('Error al interpretar PRACTICOS', e);
    return null;
  }
}

function serializePracticosArray(arr) {
  const lines = arr.map(p =>
    '            { file: ' + JSON.stringify(p.file) + ', num: ' + JSON.stringify(p.num) + ', name: ' + JSON.stringify(p.name) + ', title: ' + JSON.stringify(p.title) + ', icon: ' + JSON.stringify(p.icon) + ',\n' +
    '              description: ' + JSON.stringify(p.description) + ' }'
  );
  return '[\n' + lines.join(',\n') + '\n        ]';
}

function updatePracticosHTML(htmlText, entry) {
  const found = extractPracticosArray(htmlText);
  if (!found) return null;
  const arr = found.arr;
  const idx = arr.findIndex(p => p.file === entry.file);
  if (idx === -1) arr.push(entry); else arr[idx] = entry;
  return htmlText.slice(0, found.arrStart) + serializePracticosArray(arr) + htmlText.slice(found.arrEnd + 1);
}

function updateIndex(file) {
  if (!state.meta.title) {
    alert('Completa el título del práctico en la pestaña "1. Información General" primero.');
    return;
  }
  const entry = {
    file: slugify(state.meta.title) + '.html',
    num: state.meta.indexNum || '',
    name: state.meta.indexMenuName || state.meta.title,
    title: state.meta.title,
    icon: state.meta.indexIcon || '📘',
    description: state.meta.indexDescription || ''
  };
  const reader = new FileReader();
  reader.onload = () => {
    const updated = updatePracticosHTML(String(reader.result), entry);
    if (!updated) {
      alert('No se encontró el listado de prácticos (PRACTICOS) en el archivo subido. ¿Es el practicos.html correcto?');
      return;
    }
    downloadBlob(updated, 'practicos.html', 'text/html');
    alert('practicos.html actualizado y descargado. Reemplaza el archivo en la carpeta del proyecto.');
  };
  reader.onerror = () => alert('No se pudo leer el archivo.');
  reader.readAsText(file);
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch(e) { alert('El archivo no es un JSON válido.'); return; }
    if (!parsed || !Array.isArray(parsed.slides)) {
      alert('Este JSON no tiene el formato esperado (falta "slides").');
      return;
    }
    if (state.slides.length && !confirm('Esto reemplazará el práctico actual. ¿Continuar?')) return;
    parsed.slides = normalizeSlides(parsed.slides);
    state = Object.assign({meta:{title:'', courseLabel:'Patología Básica - UACh', date:'', instructor:'', email:'', office:'', hours:''}, objectives:[], bibliography:[], slides:[]}, parsed);
    editingIndex = null;
    activeTab = 'laminas';
    saveDraft();
    render();
  };
  reader.onerror = () => alert('No se pudo leer el archivo.');
  reader.readAsText(file);
}

/* ================= EVENT WIRING ================= */

function wireTabEvents() {
  if (activeTab === 'general') {
    document.querySelectorAll('[data-meta]').forEach(inp => {
      inp.addEventListener('input', () => { state.meta[inp.dataset.meta] = inp.value; saveDraft(); });
    });
    const btn = document.getElementById('btnAplicarGeneral');
    if (btn) btn.addEventListener('click', () => {
      upsertSlideOfType('title', {title: state.meta.title, instructor: state.meta.instructor, email: state.meta.email}, 'start');
      upsertSlideOfType('qa', {contact: {email: state.meta.email, office: state.meta.office, hours: state.meta.hours}}, 'end');
      saveDraft();
      alert('Aplicado a las láminas de Portada y Contacto.');
    });
  }
  else if (activeTab === 'contenidos') {
    renderBibliografiaList();
    const objText = document.getElementById('objetivosText');
    if (objText) objText.addEventListener('input', () => { state.objectives = textToList(objText.value); saveDraft(); });
    const btnAddBib = document.getElementById('btnAddBib');
    if (btnAddBib) btnAddBib.addEventListener('click', () => { state.bibliography.push({name:'',url:'',purpose:''}); renderBibliografiaList(); saveDraft(); });
    const btnFuentes = document.getElementById('btnUsarFuentesEstandar');
    if (btnFuentes) btnFuentes.addEventListener('click', () => {
      const present = new Set(state.bibliography.map(b => b.name));
      const nuevas = FUENTES_ESTANDAR.filter(f => !present.has(f.name)).map(f => ({...f}));
      if (!nuevas.length) { alert('Ya están todas las fuentes estándar en la lista.'); return; }
      state.bibliography.push(...nuevas);
      renderBibliografiaList(); saveDraft();
    });
    const btnAplicar = document.getElementById('btnAplicarContenidos');
    if (btnAplicar) btnAplicar.addEventListener('click', () => {
      upsertSlideOfType('objectives', {items: state.objectives.slice()});
      upsertSlideOfType('resources', {platforms: state.bibliography.map(b=>({...b}))});
      saveDraft();
      alert('Aplicado a las láminas de Objetivos y Recursos.');
    });
  }
  else if (activeTab === 'laminas') {
    if (editingIndex !== null) {
      const i = editingIndex;
      document.querySelectorAll('[data-slide-field]').forEach(inp => {
        inp.addEventListener('input', () => {
          const path = inp.dataset.slideField;
          const ftype = inp.dataset.slideType;
          let val = inp.value;
          if (ftype === 'list') val = textToList(val);
          else if (ftype === 'csv') val = csvToList(val);
          setPath(state.slides[i].content, path, val);
          saveDraft();
        });
      });
      document.querySelectorAll('[data-chipfield]').forEach(el => {
        const path = el.dataset.chipfield;
        renderChipsField(state.slides[i].content, path, 'chipsBox_' + path.replace(/\./g,'_'), saveDraft);
      });
      renderObjListItems(i);
      renderComparisonRows(i);
      const btnAddObj = document.getElementById('btnAddObjItem');
      if (btnAddObj) btnAddObj.addEventListener('click', () => {
        const objlist = OBJLIST_FIELDS[state.slides[i].type];
        const empty = {}; objlist.fields.forEach(([k]) => empty[k]='');
        (state.slides[i].content[objlist.key] ||= []).push(empty);
        saveDraft(); renderObjListItems(i); lucide.createIcons();
      });
      const btnAddRow = document.getElementById('btnAddRow');
      if (btnAddRow) btnAddRow.addEventListener('click', () => {
        const headers = state.slides[i].content.headers || [];
        (state.slides[i].content.rows ||= []).push(headers.map(()=>''));
        saveDraft(); renderComparisonRows(i); lucide.createIcons();
      });
      const btnVolver = document.getElementById('btnVolverLista');
      if (btnVolver) btnVolver.addEventListener('click', () => { editingIndex = null; render(); });
      const btnGuardar = document.getElementById('btnGuardarLamina');
      if (btnGuardar) btnGuardar.addEventListener('click', () => { editingIndex = null; saveDraft(); render(); });
    } else if (libraryOpen) {
      wireLibraryBrowserEvents();
    } else {
      renderSlideList();
      document.querySelectorAll('[data-add-type]').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.addType;
          if (type === 'case' && LAMINAS_BANK.length) {
            libraryOpen = true;
            libraryFilter = '';
            render();
            return;
          }
          state.slides.push({type, content: defaultContent(type)});
          editingIndex = state.slides.length - 1;
          saveDraft();
          render();
        });
      });
    }
  }
  else if (activeTab === 'generar') {
    const frame = document.getElementById('previewFrame');
    if (frame) frame.srcdoc = state.slides.length ? generateFullHTML() : '<p style="font-family:sans-serif;padding:2rem;color:#666">Agrega al menos una sección en la pestaña "3. Secciones" para ver la vista previa.</p>';
    const btnUpd = document.getElementById('btnActualizarPreview');
    if (btnUpd) btnUpd.addEventListener('click', () => { frame.srcdoc = generateFullHTML(); });
    const btnDl = document.getElementById('btnDescargar');
    if (btnDl) btnDl.addEventListener('click', downloadHTML);
    const btnDlJson = document.getElementById('btnDescargarJSON');
    if (btnDlJson) btnDlJson.addEventListener('click', exportJSON);
    const btnIdx = document.getElementById('btnActualizarIndice');
    const fileIdx = document.getElementById('fileIndexInput');
    if (btnIdx && fileIdx) {
      btnIdx.addEventListener('click', () => fileIdx.click());
      fileIdx.addEventListener('change', (e) => {
        if (e.target.files[0]) updateIndex(e.target.files[0]);
        e.target.value = '';
      });
    }
  }
}

document.getElementById('btnCargarHTML').addEventListener('click', () => document.getElementById('fileHtmlInput').click());
document.getElementById('fileHtmlInput').addEventListener('change', (e) => {
